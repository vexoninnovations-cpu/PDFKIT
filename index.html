<script>
/* ============================================================
   SETUP
============================================================ */
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
const { PDFDocument, StandardFonts, rgb, degrees } = PDFLib;

/* ============================================================
   HELPERS
============================================================ */
function fmt(b){ if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(1)+' KB'; return (b/1048576).toFixed(2)+' MB'; }

function download(data, name, mime){
  const blob = data instanceof Blob ? data : new Blob([data], {type:mime||'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

async function loadBytes(file){ return new Uint8Array(await file.arrayBuffer()); }
async function loadPdfLib(bytes){ return PDFDocument.load(bytes, { ignoreEncryption:true }); }
async function openPdfJs(bytes){ return pdfjsLib.getDocument({ data: bytes.slice(0) }).promise; }

function parseRanges(input, total){
  const set = new Set();
  const t = (input||'').trim().toLowerCase();
  if(t==='' || t==='all'){
    for(let i=0;i<total;i++) set.add(i);
    return [...set];
  }
  for(const part of t.split(',')){
    const p = part.trim(); if(!p) continue;
    const m = p.match(/^(\d+)\s*-\s*(\d+)$/);
    if(m){
      let a=parseInt(m[1]), b=parseInt(m[2]);
      if(a>b)[a,b]=[b,a];
      for(let i=a;i<=b;i++) if(i>=1&&i<=total) set.add(i-1);
    } else if(/^\d+$/.test(p)){
      const n=parseInt(p);
      if(n>=1&&n<=total) set.add(n-1);
    }
  }
  return [...set].sort((a,b)=>a-b);
}

function rgbHex(hex){
  const h = hex.replace('#','');
  const r = parseInt(h.substr(0,2),16)/255;
  const g = parseInt(h.substr(2,2),16)/255;
  const b = parseInt(h.substr(4,2),16)/255;
  return rgb(r,g,b);
}

async function renderPageToCanvas(page, scale){
  const vp = page.getViewport({ scale });
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(vp.width));
  canvas.height = Math.max(1, Math.round(vp.height));
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return { canvas, vp };
}

function canvasBlob(canvas, type, quality){
  return new Promise((res, rej) => canvas.toBlob(b => b?res(b):rej(new Error('toBlob failed')), type, quality));
}

async function decodeImageToCanvas(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error('Cannot decode image: ' + file.name + ' (format may not be supported by your browser)'));
      im.src = url;
    });
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img, 0, 0);
    return { canvas, width: img.naturalWidth, height: img.naturalHeight };
  } finally {
    URL.revokeObjectURL(url);
  }
}

/* ---------- NEW: target-size helpers ---------- */

function parseSizeInput(val, unit){
  const v = parseFloat(val);
  if(!isFinite(v) || v <= 0) throw new Error('Enter a valid size (5 KB – 2048 KB)');
  const bytes = Math.round(v * (unit === 'MB' ? 1048576 : 1024));
  const MIN = 5 * 1024;
  const MAX = 2048 * 1024;
  if(bytes < MIN) throw new Error('Minimum is 5 KB');
  if(bytes > MAX) throw new Error('Maximum is 2 MB (2048 KB)');
  return bytes;
}

// Iteratively compress a canvas to fit under targetBytes.
// Returns { blob, quality, achieved } — achieved=false means the smallest
// achievable size was still above target.
async function compressImageToTarget(sourceCanvas, targetBytes){
  let workCanvas = sourceCanvas;
  let scale = 1;
  let bestResult = null;
  const qualities = [0.85, 0.6, 0.35, 0.1];

  for(let iter=0; iter<12; iter++){
    for(const q of qualities){
      const blob = await canvasBlob(workCanvas, 'image/jpeg', q);
      if(!bestResult || blob.size < bestResult.blob.size){
        bestResult = { blob, quality: q, achieved: blob.size <= targetBytes };
      }
      if(blob.size <= targetBytes){
        return bestResult;
      }
    }
    scale *= 0.7;
    if(sourceCanvas.width * scale < 40 || sourceCanvas.height * scale < 40) break;
    const newCanvas = document.createElement('canvas');
    newCanvas.width = Math.max(1, Math.round(sourceCanvas.width * scale));
    newCanvas.height = Math.max(1, Math.round(sourceCanvas.height * scale));
    const ctx = newCanvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,newCanvas.width,newCanvas.height);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(sourceCanvas, 0, 0, newCanvas.width, newCanvas.height);
    workCanvas = newCanvas;
  }
  return bestResult;
}

// Compress an entire PDF to fit a total target byte budget.
async function compressPdfToTarget(file, targetBytes, onProgress){
  const pdf = await openPdfJs(await loadBytes(file));
  const numPages = pdf.numPages;

  const rendered = [];
  const originalSizes = [];
  for(let i=1;i<=numPages;i++){
    if(onProgress) onProgress(`Rendering page ${i}/${numPages}…`, 0.4 * (i/numPages));
    const page = await pdf.getPage(i);
    const { canvas } = await renderPageToCanvas(page, 1.5);
    rendered.push({ page, canvas });
    originalSizes.push(page.getViewport({ scale: 1 }));
  }

  const MAX_ATTEMPTS = 4;
  let perPageBudget = Math.floor(targetBytes / numPages * 0.85);
  let bestOut = null;
  let bestSize = Infinity;
  let bestAchieved = false;

  for(let attempt=0; attempt<MAX_ATTEMPTS; attempt++){
    const out = await PDFDocument.create();
    for(let i=0;i<numPages;i++){
      const totalSteps = MAX_ATTEMPTS * numPages;
      const currentStep = attempt * numPages + i + 1;
      if(onProgress) onProgress(
        `Compressing page ${i+1}/${numPages} (attempt ${attempt+1})…`,
        0.4 + 0.6 * (currentStep / totalSteps)
      );
      const { canvas } = rendered[i];
      const res = await compressImageToTarget(canvas, perPageBudget);
      const img = await out.embedJpg(new Uint8Array(await res.blob.arrayBuffer()));
      const orig = originalSizes[i];
      const p = out.addPage([orig.width, orig.height]);
      p.drawImage(img, { x:0, y:0, width:orig.width, height:orig.height });
    }
    const bytes = await out.save();
    if(bytes.length < bestSize){
      bestSize = bytes.length;
      bestOut = bytes;
      bestAchieved = bytes.length <= targetBytes;
    }
    if(bytes.length <= targetBytes) break;
    perPageBudget = Math.max(1024, Math.floor(perPageBudget * 0.7));
  }

  return { bytes: bestOut, size: bestSize, achieved: bestAchieved };
}

/* ============================================================
   HOME VIEW RENDERING
============================================================ */
const homeView = document.getElementById('home-view');
const toolView = document.getElementById('tool-view');
const grid = document.getElementById('tool-grid');
const searchInput = document.getElementById('search');
const catFilters = document.getElementById('cat-filters');

let activeCat = 0;

function renderFilters(){
  const chips = ['All','Organize & Pages','Convert','Optimize & Analyze','Edit & Forms','Security & Signing'];
  catFilters.innerHTML = '';
  chips.forEach((label, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (activeCat === i ? ' active' : '');
    b.textContent = label;
    b.onclick = () => { activeCat = i; renderFilters(); renderGrid(); };
    catFilters.appendChild(b);
  });
}

function renderGrid(){
  const q = (searchInput.value||'').toLowerCase().trim();
  grid.innerHTML = '';
  let shown = 0;
  TOOLS.forEach(t => {
    if(activeCat && t.cat !== activeCat) return;
    if(q && !(t.name+' '+t.desc+' '+CATS[t.cat]).toLowerCase().includes(q)) return;
    shown++;
    const card = document.createElement('button');
    card.className = 'card';
    card.innerHTML = `
      <div class="text-2xl mb-2">${t.icon}</div>
      <div class="font-semibold text-slate-800 mb-1">${t.name}</div>
      <div class="text-xs text-slate-500 leading-snug">${t.desc}</div>
      <div class="text-[10px] text-indigo-500 font-medium mt-3">${CATS[t.cat]}</div>
    `;
    card.onclick = () => openTool(t);
    grid.appendChild(card);
  });
  if(!shown){
    grid.innerHTML = `<div class="col-span-full text-center text-sm text-slate-500 py-10">No tools match your search.</div>`;
  }
}

searchInput.addEventListener('input', renderGrid);

/* ============================================================
   ROUTER
============================================================ */
function openTool(tool){
  homeView.classList.add('hidden');
  toolView.classList.remove('hidden');
  document.getElementById('tool-title').textContent = tool.icon + ' ' + tool.name;
  document.getElementById('tool-desc').textContent = tool.desc;
  const body = document.getElementById('tool-body');
  body.innerHTML = '';
  tool.init(body);
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('back-btn').onclick = () => {
  toolView.classList.add('hidden');
  homeView.classList.remove('hidden');
  window.scrollTo({top:0});
};

/* ============================================================
   TOOL: MERGE
============================================================ */
function initMerge(body){
  body.innerHTML = `
    <div class="field"><label>PDF files (merged in this order)</label>
      <input type="file" id="f" accept="application/pdf" multiple></div>
    <button id="run" class="btn">Merge PDFs</button>
    <div id="st" class="status"></div>`;
  const f = body.querySelector('#f'), run = body.querySelector('#run'), st = body.querySelector('#st');
  run.onclick = async () => {
    const files = [...f.files];
    if(files.length < 2) return st.textContent = 'Select at least 2 PDF files.';
    run.disabled = true; st.textContent = 'Merging…';
    try{
      const out = await PDFDocument.create();
      for(const file of files){
        const src = await loadPdfLib(await loadBytes(file));
        const pages = await out.copyPages(src, src.getPageIndices());
        pages.forEach(p => out.addPage(p));
      }
      download(await out.save(), 'merged.pdf', 'application/pdf');
      st.textContent = 'Done — merged ' + files.length + ' files.';
    }catch(e){ st.textContent = 'Error: ' + e.message; }
    finally{ run.disabled = false; }
  };
}

/* ============================================================
   TOOL: SPLIT
============================================================ */
function initSplit(body){
  body.innerHTML = `
    <div class="field"><label>PDF file</label><input type="file" id="f" accept="application/pdf"></div>
    <div class="field"><label>Split mode</label>
      <select id="mode">
        <option value="ranges">Extract custom ranges into one PDF</option>
        <option value="each">Split into individual pages (ZIP)</option>
        <option value="every">Split every N pages (ZIP)</option>
      </select></div>
    <div class="field" id="range-wrap"><label>Page ranges (e.g. 1-3,5,7-9)</label>
      <input type="text" id="ranges" placeholder="1-3,5,7-9"></div>
    <div class="field hidden" id="every-wrap"><label>Pages per file</label>
      <input type="number" id="every" value="5" min="1"></div>
    <button id="run" class="btn">Split PDF</button>
    <div id="st" class="status"></div>`;
  const f=body.querySelector('#f'), mode=body.querySelector('#mode'), st=body.querySelector('#st'), run=body.querySelector('#run');
  const rangeWrap=body.querySelector('#range-wrap'), everyWrap=body.querySelector('#every-wrap');
  mode.onchange = () => {
    rangeWrap.classList.toggle('hidden', mode.value !== 'ranges');
    everyWrap.classList.toggle('hidden', mode.value !== 'every');
  };
  run.onclick = async () => {
    const file = f.files[0];
    if(!file) return st.textContent = 'Select a PDF first.';
    run.disabled = true; st.textContent = 'Working…';
    try{
      const src = await loadPdfLib(await loadBytes(file));
      const total = src.getPageCount();

      if(mode.value === 'ranges'){
        const idx = parseRanges(body.querySelector('#ranges').value, total);
        if(!idx.length) throw new Error('No valid pages in range.');
        const out = await PDFDocument.create();
        const pages = await out.copyPages(src, idx);
        pages.forEach(p => out.addPage(p));
        download(await out.save(), 'split.pdf', 'application/pdf');
        st.textContent = 'Done — extracted ' + idx.length + ' pages.';
      }
      else if(mode.value === 'each'){
        const zip = new JSZip();
        for(let i=0;i<total;i++){
          const out = await PDFDocument.create();
          const [p] = await out.copyPages(src, [i]);
          out.addPage(p);
          zip.file(`page-${String(i+1).padStart(3,'0')}.pdf`, await out.save());
        }
        download(await zip.generateAsync({type:'blob'}), 'split-pages.zip', 'application/zip');
        st.textContent = 'Done — ' + total + ' separate PDFs in ZIP.';
      }
      else{
        const n = Math.max(1, parseInt(body.querySelector('#every').value)||1);
        const zip = new JSZip();
        let part = 1;
        for(let start=0; start<total; start+=n){
          const idx = [];
          for(let i=start; i<Math.min(start+n, total); i++) idx.push(i);
          const out = await PDFDocument.create();
          const pages = await out.copyPages(src, idx);
          pages.forEach(p => out.addPage(p));
          zip.file(`part-${String(part).padStart(2,'0')}.pdf`, await out.save());
          part++;
        }
        download(await zip.generateAsync({type:'blob'}), 'split-parts.zip', 'application/zip');
        st.textContent = 'Done — ' + (part-1) + ' files in ZIP.';
      }
    }catch(e){ st.textContent = 'Error: ' + e.message; }
    finally{ run.disabled = false; }
  };
}

/* ============================================================
   TOOL: ORGANIZE
============================================================ */
function initOrganize(body){
  body.innerHTML = `
    <div class="field"><label>PDF file</label><input type="file" id="f" accept="application/pdf"></div>
    <div id="list" class="mt-3"></div>
    <div class="flex flex-wrap gap-2 mt-3">
      <button id="blank" class="btn-ghost">+ Blank page at end</button>
      <button id="save" class="btn">Save PDF</button>
    </div>
    <div id="st" class="status"></div>`;
  const f = body.querySelector('#f');
  const list = body.querySelector('#list');
  const st = body.querySelector('#st');
  let srcDoc = null;
  let order = [];

  function renderList(){
    if(!order.length){ list.innerHTML = ''; return; }
    list.innerHTML = '';
    order.forEach((entry, i) => {
      const row = document.createElement('div');
      row.className = 'page-row';
      row.innerHTML = `
        <span class="font-mono text-xs text-slate-400 w-6">${i+1}</span>
        <span class="flex-1 text-slate-700">${entry.blank ? '(blank page)' : 'Page ' + (entry.srcIndex+1)}${entry.rot ? ' · rotated ' + entry.rot + '°' : ''}</span>
        <button class="mini" data-a="up" title="Move up">↑</button>
        <button class="mini" data-a="down" title="Move down">↓</button>
        <button class="mini" data-a="rot" title="Rotate 90°">⟳</button>
        <button class="mini" data-a="del" title="Delete">✕</button>
      `;
      row.querySelectorAll('button').forEach(b => {
        b.onclick = () => {
          const a = b.dataset.a;
          if(a === 'up' && i > 0){ [order[i-1], order[i]] = [order[i], order[i-1]]; }
          else if(a === 'down' && i < order.length-1){ [order[i+1], order[i]] = [order[i], order[i+1]]; }
          else if(a === 'rot'){ entry.rot = (entry.rot + 90) % 360; }
          else if(a === 'del'){ order.splice(i, 1); }
          renderList();
        };
      });
      list.appendChild(row);
    });
  }

  f.onchange = async () => {
    const file = f.files[0];
    if(!file) return;
    st.textContent = 'Loading…';
    try{
      srcDoc = await loadPdfLib(await loadBytes(file));
      const total = srcDoc.getPageCount();
      order = [];
      for(let i=0;i<total;i++) order.push({ srcIndex: i, rot: 0, blank: false });
      st.textContent = 'Loaded ' + total + ' pages. Use the arrows and buttons to arrange.';
      renderList();
    }catch(e){ st.textContent = 'Error: ' + e.message; }
  };

  body.querySelector('#blank').onclick = () => {
    if(!srcDoc) return st.textContent = 'Load a PDF first.';
    order.push({ srcIndex: null, rot: 0, blank: true });
    renderList();
  };

  body.querySelector('#save').onclick = async () => {
    if(!srcDoc || !order.length) return st.textContent = 'Load a PDF first.';
    st.textContent = 'Saving…';
    try{
      const out = await PDFDocument.create();
      for(const entry of order){
        if(entry.blank){
          const p = out.addPage([595, 842]);
          if(entry.rot) p.setRotation(degrees(entry.rot));
        } else {
          const [copied] = await out.copyPages(srcDoc, [entry.srcIndex]);
          const base = srcDoc.getPage(entry.srcIndex).getRotation().angle || 0;
          if(base + entry.rot) copied.setRotation(degrees((base + entry.rot) % 360));
          out.addPage(copied);
        }
      }
      download(await out.save(), 'organized.pdf', 'application/pdf');
      st.textContent = 'Done — saved ' + order.length + ' pages.';
    }catch(e){ st.textContent = 'Error: ' + e.message; }
  };
}

        );

  };
}

        md += `## Page ${i}\n\n${text}\n\n`;
      }
      download(md, 'extracted.md', 'text/markdown');

function initCompress(body){
  body.innerHTML = `
    <div class="field"><label>PDF file</label><input type="file" id="f" accept="application/pdf"></div>
    <div class="field"><label>Compression mode</label>

    </div>

    <button id="run" class="btn">Compress PDF</button>
    <div class="w-full bg-slate-200 rounded-full h-2 mt-3 hidden" id="prog"><div class="bg-indigo-600 h-2 rounded-full transition-all" id="progf" style="width:0%"></div></div>
    <div id="st" class="status"></div>`;

  const f=body.querySelector('#f'), st=body.querySelector('#st'), run=body.querySelector('#run');
  const prog=body.querySelector('#prog'), progf=body.querySelector('#progf');
  const mode=body.querySelector('#mode');
  const presetWrap=body.querySelector('#preset-wrap'), targetWrap=body.querySelector('#target-wrap');

  mode.onchange = () => {
    presetWrap.classList.toggle('hidden', mode.value !== 'preset');
    targetWrap.classList.toggle('hidden', mode.value !== 'target');
  };

  run.onclick = async () => {
    const file = f.files[0];
    if(!file) return st.textContent = 'Select a PDF first.';
    run.disabled = true; prog.classList.remove('hidden');
    try{
      if(mode.value === 'preset'){
        const [q, scale] = body.querySelector('#preset').value.split(',').map(parseFloat);
        const bytes = await loadBytes(file);
        const pdf = await openPdfJs(bytes);
        const out = await PDFDocument.create();
        for(let i=1;i<=pdf.numPages;i++){
          st.textContent = `Processing page ${i}/${pdf.numPages}…`;
          progf.style.width = `${((i-1)/pdf.numPages)*100}%`;
          const page = await pdf.getPage(i);
          const { canvas } = await renderPageToCanvas(page, scale);
          const blob = await canvasBlob(canvas, 'image/jpeg', q);
          const img = await out.embedJpg(new Uint8Array(await blob.arrayBuffer()));
          const orig = page.getViewport({ scale: 1 });
          const p = out.addPage([orig.width, orig.height]);
          p.drawImage(img, { x:0, y:0, width:orig.width, height:orig.height });
        }
        progf.style.width = '100%';
        const outBytes = await out.save();
        download(outBytes, 'compressed.pdf', 'application/pdf');
        st.textContent = `Done — original ${fmt(file.size)}, compressed ${fmt(outBytes.length)}.`;
      } else {
        let targetBytes;
        try{
          targetBytes = parseSizeInput(
            body.querySelector('#target-val').value,
            body.querySelector('#target-unit').value
          );
        }catch(err){
          throw new Error(err.message);
        }
        if(targetBytes >= file.size){
          st.textContent = `Target (${fmt(targetBytes)}) is already ≥ original (${fmt(file.size)}). No compression needed.`;
          run.disabled = false; prog.classList.add('hidden');
          return;
        }
        const result = await compressPdfToTarget(file, targetBytes, (msg, pct) => {
          st.textContent = msg;
          progf.style.width = `${Math.min(100, pct*100)}%`;
        });
        progf.style.width = '100%';
        download(result.bytes, 'compressed.pdf', 'application/pdf');
        if(result.achieved){
          st.textContent = `Done — original ${fmt(file.size)}, compressed ${fmt(result.size)} (target ${fmt(targetBytes)}).`;
        } else {
          st.textContent = `Best effort: original ${fmt(file.size)}, compressed ${fmt(result.size)}. Target ${fmt(targetBytes)} could not be reached without losing too much detail.`;
        }
      }
    }catch(e){ st.textContent = 'Error: ' + e.message; }
    finally{ run.disabled = false; prog.classList.add('hidden'); }
  };
}

function initImageCompress(body){
  body.innerHTML = `
    <div class="field"><label>Images (JPG, PNG, WEBP — anything your browser can open)</label>
      <input type="file" id="f" accept="image/*" multiple></div>
    <div class="field"><label>Compression mode</label>
      <select id="mode">
        <option value="preset" selected>Preset (Recommended)</option>
        <option value="target">Custom target file size</option>
      </select></div>

    <div class="field" id="preset-wrap"><label>Preset</label>
      <select id="preset">
        <option value="0.3">Extreme — smallest file</option>
        <option value="0.6" selected>Recommended — balanced</option>
        <option value="0.85">Low compression — best quality</option>
      </select></div>

    <div class="field hidden" id="target-wrap">
      <label>Target size per image (5 KB – 2048 KB / 2 MB)</label>
      <div class="flex gap-2">
        <input type="number" id="target-val" value="200" min="5" max="2048" step="any" class="flex-1">
        <select id="target-unit" class="w-24"><option value="KB">KB</option><option value="MB">MB</option></select>
      </div>
      <p class="text-xs text-slate-500 mt-1">Quality and, if needed, resolution will be reduced to fit under the target.</p>
    </div>

    <button id="run" class="btn">Compress Images (ZIP)</button>
    <div id="st" class="status"></div>`;

  const f=body.querySelector('#f'), st=body.querySelector('#st'), run=body.querySelector('#run');
  const mode=body.querySelector('#mode');
  const presetWrap=body.querySelector('#preset-wrap'), targetWrap=body.querySelector('#target-wrap');

  mode.onchange = () => {
    presetWrap.classList.toggle('hidden', mode.value !== 'preset');
    targetWrap.classList.toggle('hidden', mode.value !== 'target');
  };

  run.onclick = async () => {
    const files = [...f.files];
    if(!files.length) return st.textContent = 'Select at least one image.';
    run.disabled = true;
    try{
      let targetBytes = null;
      if(mode.value === 'target'){
        targetBytes = parseSizeInput(
          body.querySelector('#target-val').value,
          body.querySelector('#target-unit').value
        );
      }
      const presetQ = parseFloat(body.querySelector('#preset').value);

      const zip = new JSZip();
      let done = 0, totalOrig = 0, totalNew = 0;

      for(const file of files){
        st.textContent = `Compressing ${done+1}/${files.length}…`;
        try{
          let blob, outName;
          if(mode.value === 'target' && file.size <= targetBytes){
            // Already under target — keep original
            blob = file;
            outName = file.name;
          } else {
            const { canvas } = await decodeImageToCanvas(file);
            if(mode.value === 'preset'){
              blob = await canvasBlob(canvas, 'image/jpeg', presetQ);
            } else {
              const res = await compressImageToTarget(canvas, targetBytes);
              blob = res.blob;
            }
            outName = file.name.replace(/\.[^.]+$/, '') + '-compressed.jpg';
          }
          zip.file(outName, blob);
          totalOrig += file.size;
          totalNew += blob.size;
          done++;
        }catch(imgErr){
          console.warn('Skipping ' + file.name + ': ' + imgErr.message);
        }
      }
      if(!done) throw new Error('No images could be compressed.');
      download(await zip.generateAsync({type:'blob'}), 'compressed-images.zip', 'application/zip');
      st.textContent = `Done — ${done}/${files.length} images. Original ${fmt(totalOrig)} → compressed ${fmt(totalNew)}.`;
    }catch(e){ st.textContent = 'Error: ' + e.message; }
    finally{ run.disabled = false; }
  };
}

    <div id="st" class="status"></div>`;
  const f=body.querySelector('#f'), st=body.querySelector('#st'), run=body.querySelector('#run');
  run.onclick = async () => {
    const file = f.files[0];
    if(!file) return st.textContent = 'Select a PDF first.';
    run.disabled = true; st.textContent = 'Adding…';
    try{
      const doc = await loadPdfLib(await loadBytes(file));
      const font = await doc.embedFont(StandardFonts.Helvetica);
      const size = parseInt(body.querySelector('#size').value) || 12;
      const start = parseInt(body.querySelector('#start').value) || 1;
      const pos = body.querySelector('#pos').value;
      doc.getPages().forEach((p, i) => {
        const { width, height } = p.getSize();
        const label = String(start + i);
        const w = font.widthOfTextAtSize(label, size);
        const margin = 24;
        let x, y;
        if(pos === 'bc'){ x = (width - w) / 2; y = margin; }
        else if(pos === 'br'){ x = width - w - margin; y = margin; }
        else if(pos === 'bl'){ x = margin; y = margin; }
        else { x = (width - w) / 2; y = height - size - margin; }
        p.drawText(label, { x, y, size, font, color: rgb(0.2,0.2,0.2) });
      });
      download(await doc.save(), 'numbered.pdf', 'application/pdf');
      st.textContent = 'Done — numbers added to ' + doc.getPageCount() + ' pages.';
    }catch(e){ st.textContent = 'Error: ' + e.message; }
    finally{ run.disabled = false; }
  };
}

function initRedact(body){
  body.innerHTML = `
    <div class="field"><label>PDF file</label><input type="file" id="f" accept="application/pdf"></div>
    <p class="text-xs text-slate-500 mb-3">Pages are rasterized, so the underlying text is permanently removed.</p>
    <div class="field"><label>Pages to redact (e.g. 1-2,5)</label><input type="text" id="pages" value="1"></div>
    <div class="row2">
      <div class="field"><label>Region X (%)</label><input type="number" id="rx" value="10" min="0" max="100"></div>
      <div class="field"><label>Region Y (% from top)</label><input type="number" id="ry" value="10" min="0" max="100"></div>
      <div class="field"><label>Region width (%)</label><input type="number" id="rw" value="80" min="1" max="100"></div>
      <div class="field"><label>Region height (%)</label><input type="number" id="rh" value="20" min="1" max="100"></div>
    </div>
    <button id="run" class="btn">Redact</button>
    <div id="st" class="status"></div>`;
  const st=body.querySelector('#st'), run=body.querySelector('#run');
  run.onclick = async () => {
    const file = body.querySelector('#f').files[0];
    if(!file) return st.textContent = 'Select a PDF first.';
    run.disabled = true; st.textContent = 'Rasterizing and redacting…';
    try{
      const bytes = await loadBytes(file);
      const src = await openPdfJs(bytes);
      const toRedact = new Set(parseRanges(body.querySelector('#pages').value, src.numPages));
      const rx = parseFloat(body.querySelector('#rx').value)/100;
      const ry = parseFloat(body.querySelector('#ry').value)/100;
      const rw = parseFloat(body.querySelector('#rw').value)/100;
      const rh = parseFloat(body.querySelector('#rh').value)/100;
      const out = await PDFDocument.create();
      for(let i=1;i<=src.numPages;i++){
        st.textContent = `Processing page ${i}/${src.numPages}…`;
        const page = await src.getPage(i);
        const { canvas } = await renderPageToCanvas(page, 2);
        if(toRedact.has(i-1)){
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#000000';
          ctx.fillRect(rx*canvas.width, ry*canvas.height, rw*canvas.width, rh*canvas.height);
        }
        const blob = await canvasBlob(canvas, 'image/jpeg', 0.85);
        const img = await out.embedJpg(new Uint8Array(await blob.arrayBuffer()));
        const orig = page.getViewport({ scale: 1 });
        const p = out.addPage([orig.width, orig.height]);
        p.drawImage(img, { x:0, y:0, width:orig.width, height:orig.height });
      }
      download(await out.save(), 'redacted.pdf', 'application/pdf');
      st.textContent = 'Done — redacted ' + toRedact.size + ' pages.';
    }catch(e){ st.textContent = 'Error: ' + e.message; }
    finally{ run.disabled = false; }
  };
}

function initSign(body){
  body.innerHTML = `
    <div class="field"><label>PDF file</label><input type="file" id="f" accept="application/pdf"></div>
    <div class="field"><label>Draw your signature below</label>
      <canvas id="sig-canvas" width="1000" height="360"></canvas>
      <div class="flex gap-2 mt-2">
        <button id="clear" class="btn-ghost">Clear</button>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label>Page to sign</label><input type="number" id="page" value="1" min="1"></div>
      <div class="field"><label>Width (points)</label><input type="number" id="w" value="180" min="40"></div>
    </div>
    <button id="run" class="btn">Sign PDF</button>
    <div id="st" class="status"></div>`;
  const canvas = body.querySelector('#sig-canvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = '#1f1d2b';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  let drawing = false;
  let lastPoint = null;

  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {
      x: (p.clientX - rect.left) * (canvas.width/rect.width),
      y: (p.clientY - rect.top) * (canvas.height/rect.height)
    };
  }
  function start(e){
    if(e.touches) e.preventDefault();
    drawing = true;
    lastPoint = getPos(e);
  }
  function move(e){
    if(!drawing) return;
    if(e.touches) e.preventDefault();
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(lastPoint.x, lastPoint.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastPoint = p;
  }
  function end(){ drawing = false; lastPoint = null; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  window.addEventListener('touchend', end);

  body.querySelector('#clear').onclick = () => {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
  };

  const st = body.querySelector('#st'), run = body.querySelector('#run');
  run.onclick = async () => {
    const file = body.querySelector('#f').files[0];
    if(!file) return st.textContent = 'Select a PDF first.';
    run.disabled = true; st.textContent = 'Signing…';
    try{
      const doc = await loadPdfLib(await loadBytes(file));
      const pageNum = parseInt(body.querySelector('#page').value)-1;
      if(pageNum < 0 || pageNum >= doc.getPageCount()) throw new Error('Page out of range.');
      const pngBytes = await new Promise(res => canvas.toBlob(b => b.arrayBuffer().then(a => res(new Uint8Array(a))), 'image/png'));
      const sig = await doc.embedPng(pngBytes);
      const page = doc.getPage(pageNum);
      const { width } = page.getSize();
      const w = parseFloat(body.querySelector('#w').value)||180;
      const h = (sig.height / sig.width) * w;
      page.drawImage(sig, { x: width - w - 40, y: 40, width: w, height: h });
      download(await doc.save(), 'signed.pdf', 'application/pdf');
      st.textContent = 'Done — signature added to page ' + (pageNum+1) + '.';
    }catch(e){ st.textContent = 'Error: ' + e.message; }
    finally{ run.disabled = false; }
  };
}

/* ============================================================
   TOOL: COMPARE
============================================================ */
function initCompare(body){
  body.innerHTML = `
    <div class="row2">
      <div class="field"><label>Original PDF</label><input type="file" id="a" accept="application/pdf"></div>
      <div class="field"><label>Revised PDF</label><input type="file" id="b" accept="application/pdf"></div>
    </div>
    <button id="run" class="btn">Compare</button>
    <div id="out" class="mt-4 text-sm font-mono max-h-96 overflow-auto"></div>
    <div id="st" class="status"></div>`;
  const st=body.querySelector('#st'), run=body.querySelector('#run'), out=body.querySelector('#out');
  run.onclick = async () => {
    const aFile = body.querySelector('#a').files[0];
    const bFile = body.querySelector('#b').files[0];
    if(!aFile || !bFile) return st.textContent = 'Select both PDFs.';
    run.disabled = true; st.textContent = 'Extracting text…';
    try{
      async function getLines(file){
        const pdf = await openPdfJs(await loadBytes(file));
        let lines = [];
        for(let i=1;i<=pdf.numPages;i++){
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          const byY = new Map();
          for(const it of content.items){
            if(!it.str) continue;
            const y = Math.round(it.transform[5]);
            if(!byY.has(y)) byY.set(y, []);
            byY.get(y).push(it.str);
          }
          const ys = [...byY.keys()].sort((a,b)=>b-a);
          for(const y of ys){
            const line = byY.get(y).join('').trim();
            if(line) lines.push(line);
          }
        }
        return lines;
      }
      const A = await getLines(aFile);
      const B = await getLines(bFile);
      const n = A.length, m = B.length;
      const dp = Array.from({length:n+1}, () => new Array(m+1).fill(0));
      for(let i=1;i<=n;i++) for(let j=1;j<=m;j++)
        dp[i][j] = A[i-1] === B[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
      const result = [];
      let i=n, j=m;
      while(i>0 || j>0){
        if(i>0 && j>0 && A[i-1] === B[j-1]){ result.unshift({t:'same', v:A[i-1]}); i--; j--; }
        else if(j>0 && (i===0 || dp[i][j-1] >= dp[i-1][j])){ result.unshift({t:'add', v:B[j-1]}); j--; }
        else { result.unshift({t:'del', v:A[i-1]}); i--; }
      }
      out.innerHTML = '';
      result.forEach(r => {
        const d = document.createElement('div');
        d.className = r.t === 'add' ? 'diff-add' : r.t === 'del' ? 'diff-del' : 'diff-same';
        d.textContent = (r.t === 'add' ? '+ ' : r.t === 'del' ? '− ' : '  ') + r.v;
        out.appendChild(d);
      });
      st.textContent = `Compared ${n} vs ${m} lines. Green = added, red = removed.`;
    }catch(e){ st.textContent = 'Error: ' + e.message; }
    finally{ run.disabled = false; }
  };
}

function initRepair(body){
  body.innerHTML = `
    <div class="field"><label>Damaged PDF</label><input type="file" id="f" accept="application/pdf"></div>
    <p class="text-xs text-slate-500 mb-3">Best-effort: attempts to parse and re-save the PDF structure. Severely damaged files, or files with broken encryption, may still fail.</p>
    <button id="run" class="btn">Attempt Repair</button>
    <div id="st" class="status"></div>`;
  const st=body.querySelector('#st'), run=body.querySelector('#run');
  run.onclick = async () => {
    const file = body.querySelector('#f').files[0];
    if(!file) return st.textContent = 'Select a PDF first.';
    run.disabled = true; st.textContent = 'Attempting repair…';
    try{
      const doc = await PDFDocument.load(await loadBytes(file), {
        ignoreEncryption: true,
        updateMetadata: false,
        throwOnInvalidObject: false
      });
      download(await doc.save(), 'repaired.pdf', 'application/pdf');
      st.textContent = 'Done — repaired PDF downloaded (' + doc.getPageCount() + ' pages recovered).';
    }catch(e){ st.textContent = 'Could not repair: ' + e.message; }
    finally{ run.disabled = false; }
  };
}

/* ============================================================
   TOOL: OCR
============================================================ */
function initOcr(body){
  body.innerHTML = `
    <div class="field"><label>Scanned PDF or image</label>
      <input type="file" id="f" accept="application/pdf,image/png,image/jpeg"></div>
    <p class="text-xs text-amber-600 mb-3">First run downloads the OCR engine and English language model (~15 MB). Requires internet on first use.</p>
    <button id="run" class="btn">Run OCR</button>
    <div id="st" class="status"></div>`;
  const st=body.querySelector('#st'), run=body.querySelector('#run');
  run.onclick = async () => {
    const file = body.querySelector('#f').files[0];
    if(!file) return st.textContent = 'Select a file first.';
    run.disabled = true;
    st.textContent = 'Loading OCR engine (this may take a minute)…';
    let worker = null;
    try{
      if(!window.Tesseract){
        await new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
          s.onload = res;
          s.onerror = () => rej(new Error('Could not load Tesseract.js (check internet connection)'));
          document.head.appendChild(s);
        });
      }
      worker = await Tesseract.createWorker('eng');
      let allText = '';
      if(file.type === 'application/pdf'){
        const pdf = await openPdfJs(await loadBytes(file));
        for(let i=1;i<=pdf.numPages;i++){
          st.textContent = `OCR page ${i}/${pdf.numPages}…`;
          const page = await pdf.getPage(i);
          const { canvas } = await renderPageToCanvas(page, 2);
          const { data } = await worker.recognize(canvas);
          allText += `\n\n===== Page ${i} =====\n\n` + data.text;
        }
      } else {
        const { canvas } = await decodeImageToCanvas(file);
        const { data } = await worker.recognize(canvas);
        allText = data.text;
      }
      download(new Blob([allText.trim()], {type:'text/plain'}), 'ocr-output.txt', 'text/plain');
      st.textContent = 'Done — extracted text saved as ocr-output.txt.';
    }catch(e){ st.textContent = 'OCR failed: ' + e.message; }
    finally{
      if(worker){ try{ await worker.terminate(); }catch(_){} }
      run.disabled = false;
    }
  };
}
